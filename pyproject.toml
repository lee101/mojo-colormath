[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-colormath"
version = "0.1.0"
description = "Mojo-accelerated color conversion and delta-E"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = "MIT"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
